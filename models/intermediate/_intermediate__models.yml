version: 2

models:
  - name: int_orders_with_payments
    description: >
      Одна строка - один заказ (включая тестовые), с итогами платежей.
      Модель группирует платежи по заказу, затем соединяет их с заказами через LEFT JOIN. Заказы без платежей остаются в результате.
    columns:
      - name: order_id
        description: "Номер заказа."
      - name: items_count
        description: "Число разных товаров в заказе, рассчитанное до соединения с платежами."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
      - name: success_operations_count
        description: "Число операций в статусе success, включая возвраты."
      - name: failed_operations_count
        description: "Число неуспешных операций."
      - name: pending_operations_count
        description: "Число операций в ожидании."

  - name: int_products_with_categories
    description: >
      Одна строка - один товар с иерархией категорий до трех уровней.
      Связь товара с категорией - по названию, связь категорий между собой - по номерам.
      Товар остается в результате, даже если категория или ее родители не найдены.
    columns:
      - name: product_id
        description: "Номер товара."
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Название категории из записи товара."
      - name: category_id
        description: "Номер категории, найденной по названию."
      - name: parent_category_id
        description: "Номер родительской категории, если она есть."
      - name: parent_category_name
        description: "Название родительской категории."
      - name: grandparent_category_id
        description: "Номер категории на уровень выше родительской, если она есть."
      - name: grandparent_category_name
        description: "Название категории на уровень выше родительской."
      - name: root_category_name
        description: "Название корневой категории: самый верхний заполненный уровень дерева до трех уровней."

  - name: int_customer_order_metrics
    description: "Итоги подтвержденных нетестовых заказов. Одна строка - один клиент с покупками. Первая покупка определяется по времени заказа, при равенстве времени - по номеру заказа."
    columns:
      - name: customer_id
        description: "Номер клиента."
      - name: first_confirmed_order_id
        description: "Номер первой подтвержденной покупки."
      - name: first_confirmed_at
        description: "Время оформления первой подтвержденной покупки."
      - name: confirmed_orders_count
        description: "Число подтвержденных нетестовых заказов клиента."
      - name: confirmed_revenue
        description: "Сумма стоимости подтвержденных заказов после скидок."
