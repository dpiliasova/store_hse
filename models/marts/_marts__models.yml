version: 2

models:
  - name: fct_orders
    description: "{{ doc('orders_rules') }}"
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
      - name: items_count
        description: "Число разных товаров в заказе."
        data_tests: [not_null, non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]
  - name: dim_customers
    description: "Клиенты магазина. Одна строка - один клиент, включая клиентов без заказов."
    columns:
      - name: customer_id
        description: "Номер клиента."
        data_tests:
          - not_null
          - unique
      - name: registered_at
        description: "Дата и время регистрации."
      - name: registration_date
        description: "Дата регистрации без времени."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения клиента."
      - name: first_confirmed_order_id
        description: "Номер первой подтвержденной покупки по времени заказа, при равенстве времени - по номеру заказа. Пусто у клиента без покупок."
      - name: first_confirmed_at
        description: "Время оформления первой подтвержденной покупки. Пусто у клиента без покупок."
      - name: confirmed_orders_count
        description: "Число подтвержденных нетестовых заказов клиента; 0 у клиента без покупок."
        data_tests: [not_null, non_negative]
      - name: confirmed_revenue
        description: "Сумма стоимости подтвержденных заказов клиента после скидок; 0 у клиента без покупок."
        data_tests: [not_null, non_negative]
      - name: is_buyer
        description: "Есть ли у клиента хотя бы одна подтвержденная покупка."
        data_tests: [not_null]
  - name: dim_products
    description: "Товары магазина с иерархией категорий до трех уровней. Одна строка - один товар."
    columns:
      - name: product_id
        description: "Номер товара."
        data_tests:
          - not_null
          - unique
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_id
        description: "Номер непосредственной категории товара."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__product_categories')
                field: category_id
      - name: category_name
        description: "Название непосредственной категории товара."
      - name: parent_category_id
        description: "Номер родительской категории, если она есть."
      - name: parent_category_name
        description: "Название родительской категории."
      - name: grandparent_category_id
        description: "Номер категории на уровень выше родительской, если она есть."
      - name: grandparent_category_name
        description: "Название категории на уровень выше родительской."
      - name: root_category_name
        description: "Название корневой категории в дереве до трех уровней: Electronics или Home."
        data_tests: [not_null]
  - name: dim_dates
    description: "Календарь от первой до последней даты заказа в источнике, включая обе границы. Одна строка - один день."
    columns:
      - name: date_day
        description: "Календарная дата."
        data_tests:
          - not_null
          - unique
      - name: date_year
        description: "Год."
      - name: date_quarter
        description: "Номер квартала от 1 до 4."
      - name: date_month
        description: "Номер месяца от 1 до 12."
      - name: day_of_month
        description: "День месяца."
      - name: day_of_week
        description: "Номер дня недели: понедельник - 1, воскресенье - 7."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: is_weekend
        description: "Выходной день: суббота или воскресенье."
        data_tests: [not_null]
  - name: fct_order_items
    description: "Позиции нетестовых заказов. Одна строка - один товар в заказе."
    columns:
      - name: order_item_id
        description: "Ключ позиции из номера заказа и номера товара."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Номер заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Номер товара."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: order_status
        description: "Статус заказа."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]
      - name: quantity
        description: "Количество единиц товара в позиции."
        data_tests: [not_null]
      - name: unit_price
        description: "Цена одной единицы товара в рублях."
        data_tests:
          - not_null
          - non_negative
      - name: discount_amount
        description: "Скидка на всю позицию в рублях."
        data_tests:
          - not_null
          - non_negative
      - name: gross_amount
        description: "Стоимость позиции до скидки: количество * цена."
        data_tests:
          - not_null
          - non_negative
      - name: line_amount
        description: "Стоимость позиции после вычета скидки."
        data_tests:
          - not_null
          - non_negative
